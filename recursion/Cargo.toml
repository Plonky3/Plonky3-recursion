[package]
name = "p3-recursion"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Share integration fixture types across a small number of test crates.
autotests = false

[dependencies]
p3-maybe-rayon.workspace = true

# Other dependencies
hashbrown.workspace = true
itertools.workspace = true
# Plonky3 dependencies
p3-air.workspace = true
p3-baby-bear.workspace = true
p3-batch-stark.workspace = true
p3-binary-dft.workspace = true
p3-binary-field.workspace = true
p3-binary-pcs.workspace = true
p3-blake3.workspace = true
p3-bus.workspace = true
p3-challenger.workspace = true

# Local dependencies
p3-circuit.workspace = true
p3-circuit-prover.workspace = true
p3-commit.workspace = true
p3-dft.workspace = true
p3-field.workspace = true
p3-fri.workspace = true
p3-goldilocks.workspace = true
p3-keccak.workspace = true
p3-koala-bear.workspace = true
p3-lookup.workspace = true
p3-matrix.workspace = true
p3-merkle-tree.workspace = true
p3-multi-stark.workspace = true
p3-multilinear-util.workspace = true
p3-poseidon2-air.workspace = true
p3-poseidon2-circuit-air.workspace = true
p3-sumcheck.workspace = true
p3-symmetric.workspace = true
p3-uni-stark.workspace = true
p3-util.workspace = true
p3-whir.workspace = true
postcard = { version = "1.1.3", features = ["alloc"] }
rand = { workspace = true, features = ["std_rng"] }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
unroll.workspace = true

[dev-dependencies]
clap.workspace = true
libmimalloc-sys.workspace = true
mimalloc.workspace = true
p3-air.workspace = true
p3-challenger.workspace = true
p3-dft.workspace = true
p3-goldilocks.workspace = true
p3-keccak-air.workspace = true
p3-matrix.workspace = true
p3-poseidon2.workspace = true
p3-test-utils.workspace = true
p3-util.workspace = true
proptest.workspace = true
rand.workspace = true
rayon.workspace = true
tracing-forest = { workspace = true, features = ["smallvec"] }
tracing-subscriber = { workspace = true, features = ["std", "env-filter"] }

[features]
parallel = [
    "p3-maybe-rayon/parallel",
    "p3-circuit/parallel",
    "p3-circuit-prover/parallel",
    "p3-poseidon2-circuit-air/parallel",
]

[[test]]
name = "binary_boolean"
path = "tests/suites/binary_boolean.rs"

[[test]]
name = "binary_components"
path = "tests/suites/binary_components.rs"

[[test]]
name = "binary_poly"
path = "tests/suites/binary_poly.rs"

[[test]]
name = "binary_stark"
path = "tests/suites/binary_stark.rs"

[[test]]
name = "fri_recursion"
path = "tests/suites/fri_recursion.rs"

[[test]]
name = "native_recursion"
path = "tests/suites/native_recursion.rs"

[[test]]
name = "prepared_recursion"
path = "tests/suites/prepared_recursion.rs"

[[test]]
name = "protocol_contracts"
path = "tests/suites/protocol_contracts.rs"

[[test]]
name = "whir_recursion"
path = "tests/suites/whir_recursion.rs"

[[test]]
name = "whir_quintic"
path = "tests/whir_quintic.rs"

[lints]
workspace = true
