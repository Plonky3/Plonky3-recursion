name: CI

on:
  push:
    # Keep these base branches aligned with release-plz.yml.
    branches:
      - "main"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  pull_request:
    branches: [ "*" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0 # reduce disk bloat

jobs:
  packaged_crates:
    name: Packaged crate consumer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run from published archives
        run: python3 scripts/check_packaged_crates.py

  workspace_tests:
    name: Workspace tests (${{ matrix.features || 'baseline' }}, ${{ matrix.shard }}, ${{ matrix.partition }}/${{ matrix.partition_count }})
    env:
      # Debug info and generic symbol names exhaust hosted runner disks.
      # Profile settings keep debug assertions and compose with the AVX2 RUSTFLAGS.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: symbols
      CARGO_PROFILE_TEST_STRIP: symbols
      # Optimize proof-heavy tests while keeping assertions and overflow checks.
      # Level 1 also shares generic instantiations across integration binaries.
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      # Run the largest proof tests alone to fit hosted runner memory.
      NEXTEST_PROFILE: ci
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        shard: [core, boolean, poly, stark, protocol]
        os: [ubuntu-latest]
        features: ['', '+avx2']
        # Proof tests must run alone for memory safety. Spread their runtime
        # across runners without splitting Cargo targets or skipping tests.
        partition: [1, 2, 3]
        exclude:
          - { shard: core, partition: 2 }
          - { shard: core, partition: 3 }
          - { shard: poly, partition: 3 }
          - { shard: protocol, partition: 2 }
          - { shard: protocol, partition: 3 }
        include:
          - shard: core
            partition_count: 1
            targets: >-
              --lib --bins --examples --benches
              --test arity4_mmcs --test arity4_mmcs_fields --test assurance_algebraic
              --test binary_encoding --test binary_fields --test binary_hashes --test binary_host
              --test binary_tower128 --test blake3_compress --test byte_hash --test byte_hash_mmcs
              --test construction_limits --test construction_native --test diagnostics
              --test direct_circuit_air --test exactly_one --test indexed_circuit_air --test input_dedup
              --test keccak_f1600 --test manifest --test native_binary_bits --test native_binary_circuit_air
              --test native_binary_coordinates --test native_binary_mmcs --test native_bus_circuit_air
              --test native_keccak --test native_poly192 --test native_tower128 --test npo_integration
              --test statement --test statement_schema_api --test trusted_statement
            profile: --config profile.test.package.p3-recursion.opt-level=0
            feature_args: ''
          - shard: boolean
            partition_count: 3
            targets: --test binary_boolean
            profile: ''
            feature_args: --features p3-recursion/parallel,p3-poseidon1-circuit-air/parallel
          - shard: poly
            partition_count: 2
            targets: --test binary_poly --test native_recursion
            profile: ''
            feature_args: --features p3-recursion/parallel,p3-poseidon1-circuit-air/parallel
          - shard: stark
            partition_count: 3
            targets: --test binary_stark --test whir_recursion --test whir_quintic
            profile: ''
            feature_args: --features p3-recursion/parallel,p3-poseidon1-circuit-air/parallel
          - shard: protocol
            partition_count: 1
            targets: --test binary_components --test fri_recursion --test prepared_recursion --test protocol_contracts
            profile: ''
            feature_args: --features p3-recursion/parallel,p3-poseidon1-circuit-air/parallel
    runs-on: ${{ matrix.os }}
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    steps:
      - uses: actions/checkout@v7

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python3 -m pip install PyYAML==6.0.3

      - name: Test maintenance scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - uses: dtolnay/rust-toolchain@stable
        id: rs-stable

      - name: Set flags (AVX2)
        if: ${{ matrix.features }}
        run: |
          echo "RUSTFLAGS=-Ctarget-feature=${{ matrix.features }}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.features }}
          cache-on-failure: true

      # nextest schedules every test from every binary in one pool instead of
      # running binaries one at a time, so idle cores get filled by other
      # crates' tests while a single long-running test is still executing.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Disk usage (before)
        run: |
          set -eux
          df -h
          du -sh target || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

      # Single binary verifier tests peak close to the runner's 16 GB of RAM.
      # Swap absorbs a short overshoot instead of losing the runner.
      - name: Add swap
        if: ${{ matrix.shard != 'core' }}
        run: |
          set -eux
          sudo fallocate -l 16G /extra.swap
          sudo chmod 600 /extra.swap
          sudo mkswap /extra.swap
          sudo swapon /extra.swap
          swapon --show
          free -h

      - name: Test shard (workspace)
        run: >-
          cargo nextest run --locked --workspace --timings
          ${{ matrix.targets }} ${{ matrix.profile }} ${{ matrix.feature_args }}
          --partition hash:${{ matrix.partition }}/${{ matrix.partition_count }}

      # Core covers serial execution and all diagnostic/profiling features.
      # Proof shards exercise parallel execution once: recording millions of
      # diagnostic allocations exceeds runner memory and doubles compilation.
      - name: Test shard (workspace, all-features)
        if: ${{ matrix.shard == 'core' }}
        run: >-
          cargo nextest run --locked --workspace --all-features --timings
          ${{ matrix.targets }} ${{ matrix.profile }}
          --partition hash:${{ matrix.partition }}/${{ matrix.partition_count }}

      - name: Upload compilation timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ matrix.shard }}-${{ matrix.partition }}-${{ matrix.os }}-${{ matrix.features || 'baseline' }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html

  workspace_checks:
    name: Workspace checks
    env:
      # Debug info and generic symbol names exhaust hosted runner disks.
      # Profile settings keep debug assertions and compose with the AVX2 RUSTFLAGS.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: symbols
      CARGO_PROFILE_TEST_STRIP: symbols
      # Optimize proof-heavy tests while keeping assertions and overflow checks.
      # Level 1 also shares generic instantiations across integration binaries.
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      # Level 1 reduces oracle/benchmark compilation; release debug assertions stay off.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      # Run the largest proof tests alone to fit hosted runner memory.
      NEXTEST_PROFILE: ci
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            features: "+avx2"
    runs-on: ${{ matrix.os }}
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    steps:
      - uses: actions/checkout@v7

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python3 -m pip install PyYAML==6.0.3

      - name: Test maintenance scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - uses: dtolnay/rust-toolchain@stable
        id: rs-stable

      - name: Set flags (AVX2)
        if: ${{ matrix.features }}
        run: |
          echo "RUSTFLAGS=-Ctarget-feature=${{ matrix.features }}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.features }}
          cache-on-failure: true

      - name: Check (release)
        run: cargo check --locked --verbose --workspace --all-targets --release

      - name: Test challenger rejection oracles (release)
        if: ${{ !matrix.features }}
        run: |
          cargo test --locked --verbose --release -p p3-recursion --test protocol_contracts challenger_sponge_binding::
          cargo test --locked --verbose --release -p p3-recursion --test protocol_contracts challenger_base_sponge_binding::
          cargo test --locked --verbose --release -p p3-circuit-prover --test assurance_algebraic
          cargo test --locked --verbose --release -p p3-circuit-prover --test binary_tower128
          cargo test --locked --verbose --release -p p3-recursion --test binary_components binary_challenger_recursion::
          cargo test --locked --verbose --release -p p3-recursion --test whir_recursion whir_saturated_recursion::
          cargo test --locked --verbose --release -p p3-recursion --test whir_recursion whir_varying_folding::
          cargo test --locked --verbose --release -p p3-recursion --test whir_recursion whir_suffix_recursion::
          cargo test --locked --verbose --release -p p3-recursion --test whir_recursion whir_goldilocks_d2::
          cargo test --locked --verbose --release -p p3-recursion --test whir_recursion whir_poseidon1_recursion::
          cargo test --locked --verbose --release -p p3-recursion --test whir_recursion whir_verifier::
          cargo test --locked --verbose --release -p p3-circuit-prover --lib batch_stark_prover::tests::verify_all_tables_rejects_a_forged_constant_value -- --exact
          cargo test --locked --verbose --release -p p3-circuit-prover --lib batch_stark_prover::tests::verify_all_tables_rejects_alu_bus_only_operand_swap -- --exact
          cargo test --locked --verbose --release -p p3-circuit-prover --lib batch_stark_prover::tests::verify_all_tables_rejects_forged_horner_chain_head_seed -- --exact
          cargo test --locked --verbose --release -p p3-circuit-prover --lib batch_stark_prover::tests::assurance_trusted_verifier_rejects_seeded_same_shape_foreign_relations -- --exact
          cargo test --locked --verbose --release -p p3-circuit-prover --test trusted_statement assurance_
          cargo test --locked --verbose --release -p p3-recursion --lib prepared::trusted::tests::assurance_trusted_aggregation_rejects_seeded_statement_boundary_and_output_substitutions -- --exact
          cargo test --locked --verbose --release -p p3-recursion --test fri_recursion test_lookups::test_wrong_multiplicities -- --exact
          cargo test --locked --verbose --release -p p3-recursion --test fri_recursion zk_hiding_mmcs::test_batch_verifier_hiding_mmcs -- --exact

      - name: Test documentation
        # nextest doesn't run doctests, so cover them with plain `cargo test`.
        run: cargo test --locked --verbose --workspace --doc

      - name: Check workspace documentation
        env:
          RUSTDOCFLAGS: "-D warnings --html-in-header .cargo/katex-header.html"
        run: cargo doc --locked --workspace --no-deps

      - name: Run basic examples
        run: |
          cargo run --locked --package p3-circuit-prover --example fibonacci
          cargo run --locked --package p3-circuit-prover --example poseidon2_perm_chain
          cargo run --locked --package p3-circuit-prover --example poseidon2_perm_merkle

      - name: Run allocation_log example with debugging feature and debug logging
        env:
          RUST_LOG: debug
        run: cargo run --locked --package p3-circuit --example allocation_log --features debugging

      - name: Build benchmarks without running
        run: cargo bench --locked --no-run --workspace

      - name: Disk usage (after)
        if: always()
        run: |
          set -eux
          df -h
          du -sh target || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

  workspace_test_gate:
    name: Workspace test gate
    # Use the default success condition so partial matrix reruns retain failures.
    # Required checks below also fail when this gate is skipped.
    needs: [workspace_tests, workspace_checks]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workspace tests and checks passed"

  build_and_test:
    name: Build and Test
    needs: workspace_test_gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            features: "+avx2"
    runs-on: ${{ matrix.os }}
    if: "${{ always() && ! contains(toJSON(github.event.commits.*.message), '[skip-ci]') }}"
    steps:
      - name: Check workspace test shards and checks
        env:
          RESULT: ${{ needs.workspace_test_gate.result }}
        run: test "$RESULT" = success

  recursive_examples:
    name: Recursive Examples
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        id: rs-stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recursive-examples
          cache-on-failure: true

      - name: Disk usage (before)
        run: |
          set -eux
          df -h
          du -sh target || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

      - name: Run recursive examples (recursive_fibonacci is run in performance checks already)
        run: |
          cargo run --locked --release --features parallel --example recursive_aggregation -- --field koala-bear --num-recursive-layers 2
          cargo run --locked --release --features parallel --example recursive_keccak -- --field baby-bear -n 10 --num-recursive-layers 2

      - name: Disk usage (after)
        if: always()
        run: |
          set -eux
          df -h
          du -sh target || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

  check_embedded:
    name: Build embedded
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    env:
      target: thumbv7em-none-eabi
      CARGO_TARGET_DIR: target-embedded

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}
        id: rs-stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: embedded-${{ env.target }}
          cache-on-failure: true

      - name: Disk usage (before)
        run: |
          set -eux
          df -h
          du -sh "${CARGO_TARGET_DIR}" || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

      - name: Build
        run: |
          cargo build --locked --verbose --target ${{ env.target }} -p p3-circuit
          cargo build --locked --verbose --target ${{ env.target }} -p p3-circuit-prover
          cargo build --locked --verbose --target ${{ env.target }} -p p3-poseidon1-circuit-air
          cargo build --locked --verbose --target ${{ env.target }} -p p3-poseidon2-circuit-air
          cargo build --locked --verbose --target ${{ env.target }} -p p3-recursion
          cargo build --locked --verbose --target ${{ env.target }} -p p3-test-utils

      - name: Disk usage (after)
        if: always()
        run: |
          set -eux
          df -h
          du -sh "${CARGO_TARGET_DIR}" || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
        id: rs-stable

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-on-failure: true

      - name: Install cargo-sort
        run: cargo install cargo-sort --version 2.1.3 --locked

      - name: Sort Cargo.toml
        run: cargo +stable sort --workspace --grouped --check

      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Clippy (all-features)
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo +nightly fmt --all -- --check
