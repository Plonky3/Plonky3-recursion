name: CI

on:
  push:
    # Keep these base branches aligned with release-plz.yml.
    branches:
      - "main"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  pull_request:
    branches: [ "*" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0 # reduce disk bloat

jobs:
  packaged_crates:
    name: Packaged crate consumer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run from published archives
        run: python3 scripts/check_packaged_crates.py

  build_and_test:
    name: Build and Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            features: "+avx2"
    runs-on: ${{ matrix.os }}
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python3 -m pip install PyYAML==6.0.3

      - name: Test maintenance scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - uses: dtolnay/rust-toolchain@stable
        id: rs-stable

      - name: Set flags (AVX2)
        if: ${{ matrix.features }}
        run: |
          echo "RUSTFLAGS=-Ctarget-feature=${{ matrix.features }}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.features }}
          cache-on-failure: true

      # nextest schedules every test from every binary in one pool instead of
      # running binaries one at a time, so idle cores get filled by other
      # crates' tests while a single long-running test is still executing.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Disk usage (before)
        run: |
          set -eux
          df -h
          du -sh target || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

      - name: Test (workspace)
        run: cargo nextest run --locked --workspace --all-targets

      - name: Test (workspace, all-features)
        run: cargo nextest run --locked --workspace --all-targets --all-features

      - name: Check (release)
        run: cargo check --locked --verbose --workspace --all-targets --release

      - name: Test challenger rejection oracles (release)
        if: ${{ !matrix.features }}
        run: |
          cargo test --locked --verbose --release -p p3-recursion --test challenger_sponge_binding
          cargo test --locked --verbose --release -p p3-recursion --test challenger_base_sponge_binding
          cargo test --locked --verbose --release -p p3-circuit-prover --test assurance_algebraic
          cargo test --locked --verbose --release -p p3-circuit-prover --test binary_tower128
          cargo test --locked --verbose --release -p p3-recursion --test binary_challenger_recursion
          cargo test --locked --verbose --release -p p3-recursion --test whir_saturated_recursion
          cargo test --locked --verbose --release -p p3-circuit-prover --lib batch_stark_prover::tests::verify_all_tables_rejects_a_forged_constant_value -- --exact
          cargo test --locked --verbose --release -p p3-circuit-prover --lib batch_stark_prover::tests::verify_all_tables_rejects_alu_bus_only_operand_swap -- --exact
          cargo test --locked --verbose --release -p p3-circuit-prover --lib batch_stark_prover::tests::verify_all_tables_rejects_forged_horner_chain_head_seed -- --exact
          cargo test --locked --verbose --release -p p3-circuit-prover --lib batch_stark_prover::tests::assurance_trusted_verifier_rejects_seeded_same_shape_foreign_relations -- --exact
          cargo test --locked --verbose --release -p p3-circuit-prover --test trusted_statement assurance_
          cargo test --locked --verbose --release -p p3-recursion --lib prepared::trusted::tests::assurance_trusted_aggregation_rejects_seeded_statement_boundary_and_output_substitutions -- --exact
          cargo test --locked --verbose --release -p p3-recursion --test test_lookups test_wrong_multiplicities -- --exact
          cargo test --locked --verbose --release -p p3-recursion --test zk_hiding_mmcs test_batch_verifier_hiding_mmcs -- --exact

      - name: Test documentation
        # nextest doesn't run doctests, so cover them with plain `cargo test`.
        run: cargo test --locked --verbose --workspace --doc

      - name: Check workspace documentation
        env:
          RUSTDOCFLAGS: "-D warnings --html-in-header .cargo/katex-header.html"
        run: cargo doc --locked --workspace --no-deps

      - name: Run basic examples
        run: |
          cargo run --locked --package p3-circuit-prover --example fibonacci
          cargo run --locked --package p3-circuit-prover --example poseidon2_perm_chain
          cargo run --locked --package p3-circuit-prover --example poseidon2_perm_merkle

      - name: Run allocation_log example with debugging feature and debug logging
        env:
          RUST_LOG: debug
        run: cargo run --locked --package p3-circuit --example allocation_log --features debugging

      - name: Build benchmarks without running
        run: cargo bench --locked --no-run --workspace

      - name: Disk usage (after)
        if: always()
        run: |
          set -eux
          df -h
          du -sh target || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

  recursive_examples:
    name: Recursive Examples
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        id: rs-stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recursive-examples
          cache-on-failure: true

      - name: Disk usage (before)
        run: |
          set -eux
          df -h
          du -sh target || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

      - name: Run recursive examples (recursive_fibonacci is run in performance checks already)
        run: |
          cargo run --locked --release --features parallel --example recursive_aggregation -- --field koala-bear --num-recursive-layers 2
          cargo run --locked --release --features parallel --example recursive_keccak -- --field baby-bear -n 10 --num-recursive-layers 2

      - name: Disk usage (after)
        if: always()
        run: |
          set -eux
          df -h
          du -sh target || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

  check_embedded:
    name: Build embedded
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    env:
      target: thumbv7em-none-eabi
      CARGO_TARGET_DIR: target-embedded

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}
        id: rs-stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: embedded-${{ env.target }}
          cache-on-failure: true

      - name: Disk usage (before)
        run: |
          set -eux
          df -h
          du -sh "${CARGO_TARGET_DIR}" || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

      - name: Build
        run: |
          cargo build --locked --verbose --target ${{ env.target }} -p p3-circuit
          cargo build --locked --verbose --target ${{ env.target }} -p p3-circuit-prover
          cargo build --locked --verbose --target ${{ env.target }} -p p3-poseidon1-circuit-air
          cargo build --locked --verbose --target ${{ env.target }} -p p3-poseidon2-circuit-air
          cargo build --locked --verbose --target ${{ env.target }} -p p3-recursion
          cargo build --locked --verbose --target ${{ env.target }} -p p3-test-utils

      - name: Disk usage (after)
        if: always()
        run: |
          set -eux
          df -h
          du -sh "${CARGO_TARGET_DIR}" || true
          du -sh ~/.cargo/registry ~/.cargo/git || true

  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
        id: rs-stable

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-on-failure: true

      - name: Install cargo-sort
        run: cargo install cargo-sort --version 2.1.3 --locked

      - name: Sort Cargo.toml
        run: cargo +stable sort --workspace --grouped --check

      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Clippy (all-features)
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo +nightly fmt --all -- --check
