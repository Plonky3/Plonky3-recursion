[profile.ci]
# Hosted Linux runners have four CPUs. Keep memory reservations consistent
# when this profile is also used on a machine with more CPUs.
test-threads = 4

# Binary and native verifier circuits and their outer proofs use up to ~14 GiB
# each, and their parallel provers already occupy every CPU. Run every test in
# these suites alone so no pair of them can exhaust hosted runner memory.
[[profile.ci.overrides]]
filter = "package(=p3-recursion) & binary(/^(binary_(components|boolean|stark|poly)|native_recursion)$/)"
threads-required = "num-test-threads"

# The mixed dense and packed-bit verifier's two smallest prime-field circuits, library unit
# tests, peak at about 6.5 GB each in a debug build with `parallel`; neither was measured in
# the serial pass. Only the minimal one was measured with the circuit diagnostics of the
# all-features pass, at about 11 GB. Run them alone for the same reason.
[[profile.ci.overrides]]
filter = "package(=p3-recursion) & test(/^verifier::binary_mixed_whir_multi_stark::tests::small::(minimal|preprocessing)_/)"
threads-required = "num-test-threads"
